# After every production deployment, tell the IndexNow engines (Bing and the others; not Google) which pages changed:
# tools/indexnow.mjs. Every push to main is deployed to production by Vercel, which marks the commit with the status
# "Vercel" once the deployment is ready: the first job waits for it. The hashes of the pages as last sent live in the
# Actions cache, so only what changed is sent. Started from a push, not from Vercel's status itself: a run started by
# a status event may read the cache but not write it (15 October 2026: "cache write denied").
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: Keep the pages' hashes and send nothing (after the cache was lost, so as not to send every page again)
        type: boolean
        default: false

permissions:
  contents: read
  statuses: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  wait:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      live: ${{ steps.vercel.outputs.live }}
    steps:
      - id: vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
              --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            echo "Vercel: $state"
            case "$state" in
              success) echo "live=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              failure | error) echo "live=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 15
          done
          echo "live=false" >> "$GITHUB_OUTPUT"

  ping:
    needs: wait
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.wait.outputs.live == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      # The new deployment takes a moment to answer on nchova.com once Vercel says it is ready.
      - if: github.event_name == 'push'
        run: sleep 30
      - run: node tools/indexnow.mjs ${{ inputs.seed && '--seed' || '' }}
